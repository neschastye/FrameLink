<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Камера · FrameLink</title>
    <link rel="icon" href="/mark.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/camera.js"></script>
  </head>
  <body class="mobile">
    <header id="top">
      <div class="topbar">
        <a class="brand" href="#top" aria-label="FrameLink"
          ><img src="/mark.svg" alt="" />Frame<span>Link</span></a
        ><span class="divider"></span
        ><span class="product">Локальная студия</span
        ><span class="linkstate" id="linkState" role="status"
          >Подключение…</span
        >
      </div>
    </header>
    <main class="wrap">
      <div class="pagehead">
        <div>
          <h1>Камера</h1>
        </div>
      </div>
      <section class="panel monitor">
        <div class="stage" id="stage">
          <video id="video" autoplay playsinline muted></video>
          <div class="standby" id="standby">
            <span class="focus-icon" aria-hidden="true">◎</span
            ><strong id="stageTitle">Камера выключена</strong
            ><small id="stageHint">Разрешите Safari доступ при запуске.</small>
          </div>
          <i class="corner tl"></i><i class="corner tr"></i
          ><i class="corner bl"></i><i class="corner br"></i>
        </div>
        <div class="monitorfoot">
          <span id="camStatus">Ожидание запуска</span
          ><span class="mono" id="frameSize">— × —</span>
        </div>
      </section>
      <div class="actions">
        <button class="primary" id="stream" disabled>
          <span class="playmark" aria-hidden="true"></span
          ><span id="streamLabel">Начать трансляцию</span>
        </button>
      </div>
      <p id="note" class="note" role="status">
        Оставьте Safari открытым во время трансляции.
      </p>
      <section class="panel settings">
        <div class="panelhead">
          <h2>Параметры</h2>
          <label class="profile"
            >Профиль<select id="profile">
              <option value="custom">Свой</option>
              <option value="economy">Экономичный</option>
              <option value="standard">Основной</option>
              <option value="motion">Движение</option>
            </select></label
          >
        </div>
        <div class="fields">
          <label
            >Камера<select id="facing">
              <option value="environment">Задняя</option>
              <option value="user">Передняя</option>
            </select></label
          >
          <label
            >Разрешение<select id="height">
              <option value="480">480p</option>
              <option value="720">720p</option>
              <option value="1080">1080p</option>
            </select></label
          >
          <label
            >Частота кадров<select id="fps">
              <option>24</option>
              <option>30</option>
              <option>60</option>
            </select></label
          >
          <label
            >Битрейт, Мбит/с<input
              id="mbps"
              type="number"
              min="1"
              max="30"
              step="1"
              value="6"
          /></label>
          <label
            >Поворот<select id="rotation">
              <option value="0">0°</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select></label
          >
          <label class="check"
            ><input id="mirror" type="checkbox" />Зеркально</label
          >
          <label class="check"
            ><input id="audio" type="checkbox" />Микрофон</label
          >
        </div>
        <div id="hardware" class="fields" hidden></div>
      </section>
    </main>
  </body>
</html>
